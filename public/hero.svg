<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFDF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF6DA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EAB308;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#294C74;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="200" fill="#FDE68A" opacity="0.3"/>
  <circle cx="1100" cy="500" r="250" fill="#FCD34D" opacity="0.2"/>
  
  <!-- Main content area -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="500" height="440" rx="40" fill="white"/>
  </g>
  
  <!-- Text content -->
  <text x="140" y="180" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="56" fill="#111827">
    Every Voice
  </text>
  <text x="140" y="240" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="56" fill="url(#accentGrad)">
    Has a Story
  </text>
  
  <text x="140" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#6B7280">
    Discover inspiring stories, life experiences,
  </text>
  <text x="140" y="325" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#6B7280">
    and ideas shared by people from every walk of life.
  </text>
  
  <!-- CTA Button -->
  <rect x="140" y="380" width="220" height="55" rx="27" fill="url(#accentGrad)"/>
  <text x="175" y="415" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="18" fill="white">
    Explore Stories
  </text>
  
  <!-- Right side decorative element -->
  <g transform="translate(700, 100)">
    <!-- Large speech bubble -->
    <path d="M200 50 L350 50 L350 250 L280 250 L250 300 L220 250 L200 250 Z" fill="url(#darkGrad)" rx="20"/>
    
    <!-- W inside bubble -->
    <path d="M230 120 L255 180 L275 140 L295 180 L320 120" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- SQ text -->
    <text x="260" y="230" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="36" fill="#EAB308" text-anchor="middle">
      SQ
    </text>
  </g>
  
  <!-- Floating elements -->
  <circle cx="680" cy="450" r="15" fill="#FBBF24"/>
  <circle cx="950" cy="120" r="10" fill="#EAB308"/>
  <circle cx="1050" cy="350" r="8" fill="#F59E0B"/>
  
  <!-- Brand name -->
  <text x="80" y="560" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="url(#darkGrad)">
    Web<tspan fill="url(#accentGrad)">SQ</tspan>
  </text>
  <text x="220" y="560" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#9CA3AF">
    Every Story Matters. Every Voice Belongs.
  </text>
</svg>
